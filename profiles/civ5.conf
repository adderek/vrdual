# Civilization V, native Linux port (Civ5XP, 32-bit GL via Zink). A flat
# monitor fixed in the room: looking at it is free up to its edges, looking
# past an edge scrolls the map that way (head_look = scroll: taps
# scroll_angle degrees past the edge, held from scroll_hold_angle; both
# adjustable in the headset with input = tune). No head turn of the picture,
# so no wider culling is needed. The thread crash of this port is fixed in
# memory (game_fixes, default on); keep MaxSimultaneousThreads = 8 in the
# game's config.ini.
[game]
exe = Civ5XP
steam = 8930
# the opening movie, unskippable (vrdual intro off civ5 renames it away)
intro = steamassets/civ5_opening_movie_*.mov

[settings]
screen = flat
screen_fov = 70
lock = world
hfov = 90.7
# Civ units per meter: 0.1 left the map flat (depth only from the HUD);
# at 50 terrain and units have depth (owner, headset)
world_scale = 50
# shadow maps and baked terrain drawn at the view's size: unshifted
auto_noshift = 1
head_look = scroll
# degrees past the screen edge: taps from the edge, held 10 past it
scroll_angle = 0
scroll_hold_angle = 10
# menus, loading screens and the opening movie: no scroll keys
head_look_menus = 0
edge_mask = off
