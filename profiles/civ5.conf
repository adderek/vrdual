# Civilization V, native Linux port (Civ5XP, 32-bit GL via Zink). The map
# stays in place in the room: the rendered view counter-turns and
# counter-moves with the head (head_look, head_lean) on a head-locked screen
# at the game's FOV, and the game culls with a wider view (cull_widen, a
# game fix), so looking or leaning past the screen edge shows more map.
# Turning further scrolls the map (taps, then held). The HUD stays in place
# too. The thread crash of this port is fixed in memory (game_fixes, default
# on); keep MaxSimultaneousThreads = 8 in the game's config.ini.
[game]
exe = Civ5XP
steam = 8930

[settings]
screen = full
lock = head
hfov = 90.7
# Civ units per meter, owner-tuned
world_scale = 0.1
# shadow maps and baked terrain drawn at the view's size: unshifted
auto_noshift = 1
head_look = scroll
head_lean = on
head_rot_max = 15
# tan(hfov/2 + 15) / tan(hfov/2) for the turn above
cull_widen = 1.8
hud_follow = 90
scroll_angle = 15
scroll_hold_angle = 25
edge_mask = off
