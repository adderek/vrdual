# Minimal CI: selftest's GPU-free checks (`./vrdual ci`, ~1 min with setup).
# The full check is `./vrdual selftest` on real hardware, run by hand.
name: ci
on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0  # git describe for the build identity
      # xcb: headers only, the layer dlopens it. The image's package index is
      # usually fresh enough: update only when the install fails. Short apt
      # timeouts: a runner without DNS (2026-11-11) retried until the job's
      # 10 min limit instead of failing.
      - name: install build deps
        timeout-minutes: 4
        run: |
          apt="sudo apt-get -q -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          pkgs="glslc spirv-tools libxcb1-dev libxcb-xfixes0-dev libxcb-xtest0-dev"
          $apt install -y --no-install-recommends $pkgs || { $apt update && $apt install -y --no-install-recommends $pkgs; }
      - run: ./vrdual ci
