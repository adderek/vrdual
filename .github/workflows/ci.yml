# Minimal CI: selftest's GPU-free checks (`./vrdual ci`, ~1 min with setup).
# The full check is `./vrdual selftest` on real hardware, run by hand.
name: ci
on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0  # git describe for the build identity
      # Build deps as cached .debs: runners that could not resolve the Ubuntu
      # mirrors (2026-11-11) hung in apt until the job's limit. With the cache
      # filled, apt never touches the network. xcb: headers only, the layer
      # dlopens it. Change the key's suffix when the package list changes.
      - uses: actions/cache@v4
        with:
          path: ~/debs
          key: debs-ubuntu-24.04-v1
      - name: install build deps
        timeout-minutes: 6
        run: |
          pkgs="glslc spirv-tools libxcb1-dev libxcb-xfixes0-dev libxcb-xtest0-dev"
          if ! ls ~/debs/*.deb >/dev/null 2>&1; then
            mkdir -p ~/debs/partial
            apt="sudo timeout 90 apt-get -q -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Dir::Cache::archives=$HOME/debs"
            fetch() { $apt install -y --download-only --no-install-recommends $pkgs; }
            # the image's mirror list (Azure first), then kernel.org's mirror
            fetch || { $apt update && fetch; } || {
              echo "::warning::Ubuntu mirrors unreachable, trying mirrors.edge.kernel.org"
              sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://mirrors.edge.kernel.org/ubuntu/#' /etc/apt/sources.list.d/ubuntu.sources
              $apt update; fetch; }
            sudo chown -R "$USER" ~/debs
          fi
          sudo dpkg -i ~/debs/*.deb
      - run: ./vrdual ci
