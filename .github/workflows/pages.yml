# Public site (GitHub Pages, source "GitHub Actions"): site/ plus the
# tracked screenshots/ (wiggle GIFs, videos).
# Public material only; unpublished notes never go here (TODO 18).
name: pages
on:
  push:
    branches: [master]
    paths: ['site/**', 'screenshots/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I tools/gen_games.py --check
      - run: cp -r screenshots site/screenshots
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
